AWSTemplateFormatVersion: "2010-09-09"
Description: "Security stack - Security Groups"

Parameters:
  ProjectName:
    Type: String
    Default: lab-2

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0

Resources:
  # VpcId import từ network stack
  PublicEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-public-ec2-sg"
      GroupDescription: "Security group for public EC2 - SSH from trusted IP"
      VpcId: !ImportValue
        Fn::Sub: "${ProjectName}-VpcId"
      SecurityGroupIngress:
        - Description: "SSH from trusted IP"
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
      SecurityGroupEgress:
        - Description: "Allow all outbound traffic"
          IpProtocol: "-1"
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-ec2-sg"

  PrivateEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-private-ec2-sg"
      GroupDescription: "Security group for private EC2 - SSH from public EC2 SG"
      VpcId: !ImportValue
        Fn::Sub: "${ProjectName}-VpcId"
      SecurityGroupIngress:
        - Description: "SSH from public EC2 security group"
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref PublicEc2Sg
      SecurityGroupEgress:
        - Description: "Allow all outbound traffic"
          IpProtocol: "-1"
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-ec2-sg"

Outputs:
  PublicSgId:
    Value: !Ref PublicEc2Sg
    Export:
      Name: !Sub "${ProjectName}-PublicSgId"

  PrivateSgId:
    Value: !Ref PrivateEc2Sg
    Export:
      Name: !Sub "${ProjectName}-PrivateSgId"
